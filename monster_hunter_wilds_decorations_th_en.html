      'Opening Shot':'โบนัสกระสุนใช้กับนัดแรกหลังบรรจุกระสุนเต็มแม็กกาซีน',
      'Tetrad Shot':'โบนัสอยู่ที่นัด 4 และ 6 ของแม็กกาซีน; กระสุนที่บรรจุน้อยเกินไปจะใช้ประโยชน์ไม่ได้',
      'Ballistics':'เพิ่มระยะที่กระสุนยังทำดาเมจเต็ม เหมาะกับปืนและธนูที่ต้องรักษาระยะ',
      'Normal Shots':'มีผลเฉพาะชนิดกระสุนหรือท่าธนูตามชื่อสกิล ไม่ใช่กระสุนทุกชนิด',
      'Piercing Shots':'มีผลเฉพาะชนิดกระสุนหรือท่าธนูตามชื่อสกิล ไม่ใช่กระสุนทุกชนิด',
      'Spread/Power Shots':'มีผลเฉพาะชนิดกระสุนหรือท่าธนูตามชื่อสกิล ไม่ใช่กระสุนทุกชนิด',
      'Special Ammo Boost':'มีผลเฉพาะกระสุนพิเศษและท่าที่เกมกำหนด',
      'Guard':'ลดการถอยและการใช้สตามินาตอนกัน แต่ไม่ทำให้กันทุกท่าได้',
      'Guard Up':'ทำให้กันการโจมตีบางชนิดที่ปกติกันไม่ได้; ไม่ได้เพิ่มพลังป้องกันโดยตรง',
      'Evade Window':'เพิ่มช่วงอมตะของการหลบ ไม่ได้เพิ่มระยะหลบ',
      'Evade Extender':'เพิ่มระยะหลบ ไม่ได้เพิ่มช่วงอมตะ',
      'Quick Sheathe':'เร็วขึ้นเฉพาะการเก็บอาวุธ',
      'Windproof':'ลดผลของแรงลมตามระดับความรุนแรง ไม่ได้กันทุกระดับตั้งแต่ Lv1',
      'Tremor Resistance':'ลดผลของแรงสั่นตามระดับความรุนแรง ไม่ได้กันทุกระดับตั้งแต่ Lv1'
    };
    const query = document.getElementById('query'), type = document.getElementById('type'), slot = document.getElementById('slot'), skillCount = document.getElementById('skillCount');
    const results = document.getElementById('results'), summary = document.getElementById('summary');
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const searchable = (item) => [item.nameThai,item.nameEnglish,item.typeThai,...item.skills.flatMap(s => [s.thai,s.english,...s.levels.map(([,d]) => d)])].join(' ').toLocaleLowerCase();
    function render() {
      const word = query.value.trim().toLocaleLowerCase();
      const list = data.filter(item => (!word || searchable(item).includes(word)) && (type.value === 'all' || item.type === type.value) && (slot.value === 'all' || item.slots.includes(Number(slot.value))) && (skillCount.value === 'all' || item.skills.length === Number(skillCount.value)));
      summary.textContent = 'พบ ' + list.length + ' จาก ' + data.length + ' ชื่อพลอย';
      results.innerHTML = list.length ? list.map(item => {
        const skills = item.skills.map(skill => '<div class="skill"><b>' + escapeHtml(skill.thai) + '</b><span class="en"> — ' + escapeHtml(skill.english) + '</span><details><summary>คำอธิบาย (' + skill.levels.length + ' ระดับ)</summary><ul>' + skill.levels.map(([lv,desc]) => '<li><b>Lv' + lv + ':</b> ' + escapeHtml(desc) + '</li>').join('') + '</ul></details>' + (extraDescriptions[skill.english] ? '<div class="extra"><b>คำอธิบายเพิ่มเติม:</b> ' + escapeHtml(extraDescriptions[skill.english]) + '</div>' : '') + '</div>').join('');
        return '<article class="' + item.type + '"><div class="top"><h2>' + escapeHtml(item.nameThai) + '<small>' + escapeHtml(item.nameEnglish) + '</small></h2><span class="badge">' + item.typeThai + '</span></div><div class="meta">ใส่ได้ในช่อง: ' + item.slots.join(', ') + '</div>' + skills + '</article>';
      }).join('') : '<div class="empty">ไม่พบข้อมูลที่ตรงกับคำค้นหา</div>';
    }
    [query,type,slot,skillCount].forEach(control => control.addEventListener('input', render)); render();
  </script>
</body>
</html>
